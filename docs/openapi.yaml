openapi: 3.1.0
info:
  title: PixelForge API
  version: v1
  description: |
    JSON API for PixelForge. Every endpoint lives under `/api/v1` and, apart from
    `POST /api/v1/tokens`, needs a personal API token sent as `Authorization: Bearer <token>`.

    Tokens can be created on the **Settings → API tokens** page, with `POST /api/v1/tokens`,
    or with `php artisan api-tokens:create {email} {name}`.

    ## Response structure
    - Success: `{"data": ...}` (an object or a list). `204` responses have no body.
    - Validation error (`422`): `{"message": "...", "errors": {"<field>": ["..."]}}`.
    - Any other error (`401`, `404`, `429`, `5xx`): `{"message": "..."}`.

    ## RBAC
    No roles are enforced yet (they arrive with #18). A user can only see and revoke their own tokens.
servers:
  - url: /api/v1
security:
  - bearerToken: []
tags:
  - name: API tokens
    description: Personal tokens for the API. Console parity via `api-tokens:create|list|revoke`.
  - name: Generations
    description: Image generations. Web parity via `POST /generations`, console via `generations:create`.
  - name: Cost estimate
    description: Estimated customer price range per size × quality. Web parity via `GET /cost-estimate`, console via `cost:estimate {size} {quality}`.
paths:
  /tokens:
    post:
      tags: [API tokens]
      operationId: issueApiToken
      summary: Exchange account credentials for a new API token
      description: |
        Returns the plain-text token **once**; only a hash is stored. Wrong credentials and
        unknown emails return the same `422` on `email`, in the same time. Limited like web login:
        5 attempts per minute per email + IP (and 6 per minute per IP).

        Changing or resetting the account password revokes all of its tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email, example: ada@example.com }
                password: { type: string, format: password, example: password }
                name: { type: string, maxLength: 255, example: CI script, description: A label for the token. }
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/ApiToken'
                      - type: object
                        required: [token]
                        properties:
                          token:
                            type: string
                            description: The plain-text token. Shown only in this response.
                            example: 1|W1VptDsbh3qRDGv30F1mQRsbHtKypa4F0xC0XY6d26d06788
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [API tokens]
      operationId: listApiTokens
      summary: List the caller's API tokens, newest first
      description: Metadata only; secrets are never returned.
      responses:
        '200':
          description: The caller's tokens.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ApiToken' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /tokens/{token}:
    delete:
      tags: [API tokens]
      operationId: revokeApiToken
      summary: Revoke one of the caller's API tokens
      parameters:
        - name: token
          in: path
          required: true
          description: Token id, from the list endpoint.
          schema: { type: integer, example: 1 }
      responses:
        '204':
          description: Revoked. The token stops working immediately.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /generations:
    post:
      tags: [Generations]
      operationId: createGeneration
      summary: Create a generation and queue its submission to Pixelforge
      description: |
        Validates the input with the same rules as Pixelforge, stores the generation as `pending`
        with the current cost estimate, and queues its submission. Returns at once with `202`;
        the status then moves forward on its own: `pending → queued → processing → succeeded | failed`.

        The submission uses the generation `id` as its idempotency key, so retries never create a
        second provider generation. If Pixelforge rejects it later (for example a content policy
        violation), the generation becomes `failed` at no cost, with the reason in `error`; for a
        provider validation error, `error.fields` names the invalid parameters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              additionalProperties: false
              properties:
                prompt: { type: string, maxLength: 4000, example: A lighthouse at dawn }
                size: { $ref: '#/components/schemas/ImageSize' }
                quality: { $ref: '#/components/schemas/ImageQuality' }
                reference_images:
                  type: array
                  maxItems: 4
                  items: { type: string, format: uri, description: An http or https URL. }
                  example: ['https://example.com/style.png']
      responses:
        '202':
          description: Stored and queued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Generation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cost-estimate:
    get:
      tags: [Cost estimate]
      operationId: estimateCost
      summary: Estimated customer price range for a size and quality
      description: |
        The range is empirical: the lowest and highest customer price (rounded up to whole cents)
        of the generations that succeeded with this size and quality. With no samples yet
        (`sample_count: 0`) it is the wide seed range, 0 – 100000 cents ($0 – $1,000).
      parameters:
        - name: size
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ImageSize' }
        - name: quality
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ImageQuality' }
      responses:
        '200':
          description: The estimate.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CostEstimate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: A personal API token, e.g. `1|W1VptDsbh3qRDGv30F1mQRsbHtKypa4F0xC0XY6d26d06788`.
  schemas:
    ApiToken:
      type: object
      required: [id, name, last_used_at, created_at]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: CI script }
        last_used_at: { type: [string, 'null'], format: date-time, example: null }
        created_at: { type: [string, 'null'], format: date-time, example: '2026-11-18T17:00:00+00:00' }
    ImageSize:
      type: string
      enum: ['1024x1024', '1536x1024', '1024x1536']
      example: '1024x1024'
    ImageQuality:
      type: string
      enum: [low, medium, high]
      example: high
    Generation:
      type: object
      required: [id, status, prompt, size, quality, reference_images, estimate_min_cents, estimate_max_cents, price_usd, image_url, image_url_expires_at, error, created_at, completed_at]
      properties:
        id: { type: string, format: uuid, example: 9d6f3c1e-2b7a-4c55-9e0d-1f2a3b4c5d6e }
        status: { type: string, enum: [pending, queued, processing, succeeded, failed], example: pending }
        prompt: { type: string, example: A lighthouse at dawn }
        size: { $ref: '#/components/schemas/ImageSize' }
        quality: { $ref: '#/components/schemas/ImageQuality' }
        reference_images: { type: array, items: { type: string, format: uri }, example: ['https://example.com/style.png'] }
        estimate_min_cents: { type: [integer, 'null'], description: Estimated minimum price in whole US cents., example: 12 }
        estimate_max_cents: { type: [integer, 'null'], description: Estimated maximum price in whole US cents., example: 47 }
        price_usd:
          type: [string, 'null']
          description: The exact price, a decimal string in US dollars with 9 decimals. Null until known; "0.000000000" when failed.
          example: null
        image_url: { type: [string, 'null'], format: uri, example: null }
        image_url_expires_at: { type: [string, 'null'], format: date-time, example: null }
        error:
          oneOf:
            - type: 'null'
            - type: object
              required: [code, message, fields]
              properties:
                code: { type: string, example: validation_failed }
                message: { type: [string, 'null'], example: The selected size is invalid. }
                fields:
                  type: object
                  description: Problems per parameter, for provider validation errors; empty otherwise.
                  additionalProperties: { type: array, items: { type: string } }
                  example: { size: ['The size must be one of: 1024x1024, 1536x1024, 1024x1536.'] }
          example: null
        created_at: { type: [string, 'null'], format: date-time, example: '2026-11-19T14:03:11+00:00' }
        completed_at: { type: [string, 'null'], format: date-time, example: null }
    CostEstimate:
      type: object
      required: [size, quality, min_cents, max_cents, sample_count]
      properties:
        size: { $ref: '#/components/schemas/ImageSize' }
        quality: { $ref: '#/components/schemas/ImageQuality' }
        min_cents: { type: integer, minimum: 0, description: Lowest estimated price in whole US cents., example: 12 }
        max_cents: { type: integer, minimum: 0, description: Highest estimated price in whole US cents., example: 47 }
        sample_count: { type: integer, minimum: 0, description: Succeeded generations behind the range; 0 means the seed range., example: 4 }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string, example: These credentials do not match our records. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example:
            email: [These credentials do not match our records.]
  responses:
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Unauthenticated:
      description: Missing or invalid token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Unauthenticated. }
    NotFound:
      description: The resource does not exist or belongs to another user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit hit; retry after the `Retry-After` header.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Too Many Attempts. }
